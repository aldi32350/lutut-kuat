<script>
const { Figure, repProgress } = LK_FIG;
const EX = Object.fromEntries(LK_DATA.EXERCISES.map(e => [e.id, e]));
const NS = "http://www.w3.org/2000/svg";
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, d) => clamp((t - a) / d);
const ease = t => t * t * (3 - 2 * t);
const outCubic = t => 1 - Math.pow(1 - t, 3);
const outQuint = t => 1 - Math.pow(1 - t, 5);
const outBack = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const FPS = 30;
let INFO, EK, EN, CH = [], SC = [], WC = [], PILLS = [], OUT_AT, DURATION;

function dress(fig, c) {
  const root = fig.svg.firstChild;
  fig.torso.style.stroke = c.top; fig.arm.style.stroke = c.top;
  fig.nearLeg.style.stroke = c.legs; fig.farLeg.style.stroke = c.legsFar;
  const hat = document.createElementNS(NS, "path"); hat.setAttribute("fill", c.hat);
  const face = document.createElementNS(NS, "circle"); face.setAttribute("fill", c.skin); face.setAttribute("r", c.hijab ? 7.4 : 0);
  const pony = document.createElementNS(NS, "circle"); pony.setAttribute("fill", c.hat); pony.setAttribute("r", c.pony ? 5 : 0);
  root.insertBefore(pony, fig.head); root.insertBefore(hat, c.peci ? fig.nearLeg : fig.head); root.insertBefore(face, fig.nearLeg);
  fig.head.style.fill = c.hijab ? c.hat : c.skin;
  const orig = fig.render.bind(fig);
  fig.render = pose => {
    orig(pose);
    const hx = +fig.head.getAttribute("cx"), hy = +fig.head.getAttribute("cy");
    if (c.hijab) {
      const m = fig.torso.getAttribute("d").match(/L([\d.-]+) ([\d.-]+)/), sx = +m[1], sy = +m[2];
      const dx = hx - sx, dy = hy - sy, len = Math.hypot(dx, dy) || 1, px = -dy / len, py = dx / len, w = 12.5;
      hat.setAttribute("d", `M${hx + px * w} ${hy + py * w} L${sx + px * (w + 2) - dx / len * 7} ${sy + py * (w + 2) + 7} L${sx - px * (w + 2) - dx / len * 7} ${sy - py * (w + 2) + 7} L${hx - px * w} ${hy - py * w}Z`);
      face.setAttribute("cx", (hx + 2.4).toFixed(1)); face.setAttribute("cy", (hy + 1.6).toFixed(1));
    } else if (c.peci) {
      hat.setAttribute("d", `M${hx - 10.5} ${hy - 3} L${hx - 9.5} ${hy - 12} Q${hx} ${hy - 15} ${hx + 9.5} ${hy - 12} L${hx + 10.5} ${hy - 3}Z`);
    } else {
      hat.setAttribute("d", `M${hx - 10.5} ${hy - 1} Q${hx - 11} ${hy - 13} ${hx} ${hy - 12.5} Q${hx + 11} ${hy - 13} ${hx + 10.5} ${hy - 1} Q${hx} ${hy - 7} ${hx - 10.5} ${hy - 1}Z`);
      pony.setAttribute("cx", (hx - 11).toFixed(1)); pony.setAttribute("cy", (hy - 6).toFixed(1));
    }
  };
}
const KAKEK = { top: "#8b5a2b", legs: "#3f3f46", legsFar: "#71717a", skin: "#dca77b", hat: "#1d1d1f", peci: true };
const NENEK = { top: "#7a2e3b", legs: "#5b3b4a", legsFar: "#8f7280", skin: "#e2b088", hat: "#9a6782", hijab: true };
const CUCU = { top: "#f2a541", legs: "#4a6fa5", legsFar: "#86a0c8", skin: "#f0c49b", hat: "#3a2a20" };
function mk(id, ex, c, mirror, vb) { const f = new Figure(document.getElementById(id)); f.setExercise(ex, mirror); if (vb) f.svg.setAttribute("viewBox", vb); dress(f, c); return f; }
const SEAT = { hip: [95, 121], torso: 6, n: [90, 0, 90], f: [90, 0, 90], arm: [25, 60] };
const STAND = { hip: [95, 86], torso: 3, n: [0, 0, 90], f: [0, 0, 90], arm: [5, 10] };
const RUN = { frames: [{ ...STAND, torso: 10, n: [35, -10, 80], f: [-30, -55, 120], arm: [-30, -60] }, { ...STAND, torso: 10, n: [-30, -55, 120], f: [35, -10, 80], arm: [30, 70] }], props: [], highlight: "knee" };
const KICK = { frames: [{ ...STAND, torso: 4, n: [-20, -30, 110], f: [0, 0, 90], arm: [10, 20] }, { ...STAND, torso: -4, n: [40, 30, 70], f: [0, 0, 90], arm: [-20, -10] }], props: [], highlight: "knee" };
const SIT = { frames: [{ ...SEAT, torso: 14 }], props: ["chair"], highlight: "knee" };
let F = {};

function findWord(sub, after = 0) { return INFO.words.find(w => w.s >= after && w.w.toLowerCase().includes(sub)); }
const sentS = id => INFO.sentences.find(s => s.id === id);
function buildChunks() {
  let ws = INFO.words.map(w => ({ ...w }));
  const k = ws.findIndex(w => /lututkuat/i.test(w.w));
  if (k >= 0) { const last = ws.findIndex((w, i) => i > k && /^id\W*$/i.test(w.w)); if (last > k) ws.splice(k, last - k + 1, { ...ws[k], w: "lututkuat.web.id", e: ws[last].e }); }
  let cur = [];
  const push = () => { if (cur.length) CH.push({ words: cur, s: cur[0].s, e: cur[cur.length - 1].e, who: cur[0].who }); cur = []; };
  ws.forEach((w, idx) => {
    if (cur.length && (cur[0].i !== w.i || cur.length >= 4)) push();
    cur.push(w);
    const nx = ws[idx + 1];
    if (nx && nx.s - w.e > 0.28) push();
  });
  push();
  CH.forEach((c, i) => c.end = CH[i + 1] ? Math.min(CH[i + 1].s, c.e + 1.2) : c.e + 0.8);
  CH[0].s = 0;
}
const KW = ["lutut", "kuat", "sepuluh", "menit", "gambarnya", "suara", "hitungannya", "main!", "main", "gratis", "lututkuat.web.id", "pagi", "berdua"];

function face(p, env, envS, t, look, phase) {
  const tilt = Math.sin(t * 1.1 + phase) * 1.4 + envS * 2 + look, nod = Math.sin(t * 2.3 + phase) * envS * 4;
  $(`#${p}_head`).setAttribute("transform", `rotate(${tilt} 480 700) translate(0 ${nod})`);
  $(`#${p}_body`).setAttribute("transform", `translate(0 ${Math.sin(t * 1.6 + phase) * 3})`);
  $(`#${p}_mouth`).setAttribute("ry", (3 + 28 * env).toFixed(1)); $(`#${p}_mouth`).setAttribute("rx", (34 + 8 * env).toFixed(1));
  $(`#${p}_mouth`).style.opacity = env > 0.06 ? 1 : 0; $(`#${p}_smile`).style.opacity = env > 0.06 ? 0 : 1;
  const bl = ((t + phase) % 3.4) > 3.25 || ((t + phase * 2) % 5.1) > 4.98 ? 0.12 : 1;
  [`#${p}_eyeL`, `#${p}_eyeR`].forEach(e => $(e).setAttribute("ry", (13 * bl).toFixed(1)));
  $(`#${p}_brows`).setAttribute("transform", `translate(0 ${-envS * 9})`);
}

window.render = t => {
  const fr = Math.round(t * FPS);
  const ek = EK[Math.min(EK.length - 1, fr)] || 0, en = EN[Math.min(EN.length - 1, fr)] || 0;
  const sm = (E, f) => ((E[Math.max(0, f - 2)] || 0) + (E[f] || 0) + (E[f + 2] || 0)) / 3;
  const eks = sm(EK, fr), ens = sm(EN, fr);
  // yang tidak bicara menoleh ke yang bicara
  const cur = INFO.sentences.filter(s => t >= s.s - 0.2).pop();
  const who = cur && t < cur.e + 0.6 ? cur.who : null;
  face("k", ek, eks, t, who === "n" ? 5 : 0, 0);
  face("n", en, ens, t, who === "k" ? -5 : 0, 1.7);
  const wl = $("#who"); wl.textContent = who === "k" ? "Kakek Darmo" : who === "n" ? "Nenek Sri" : ""; wl.style.opacity = t < OUT_AT - 0.3 && who ? 1 : 0;

  const ops = new Map();
  SC.forEach((s, i) => {
    const nx = SC[i + 1], a = i === 0 ? 1 : ease(prog(t, s.t, 0.45)), b = nx ? ease(prog(t, nx.t, 0.45)) : 0;
    const op = t < s.t ? 0 : a * (1 - b), prev = ops.get(s.el);
    if (!prev || op > prev.op) ops.set(s.el, { op, sc: 1.03 - 0.03 * a + 0.025 * prog(t, s.t, 6) });
  });
  ops.forEach((v, el) => { el.style.opacity = v.op; el.style.transform = `scale(${v.sc})`; });

  const sit = ph => ({ ...SEAT, torso: 14 + 3 * Math.sin(t * 0.9 + ph) });
  F.ft_k.render(sit(0)); F.ft_n.render(sit(1.5));
  F.ft_c.setProgress(0.5 - 0.5 * Math.cos(2 * Math.PI * t / 1.3));
  const kp = (t % 1.3) / 1.3, b1 = $("#ball1");
  b1.setAttribute("cx", 820 - 40 * Math.sin(Math.PI * kp)); b1.setAttribute("cy", 1010 - 120 * Math.sin(Math.PI * kp));
  const ex = EX["luruskan-lutut"], cyc = ex.up + 1.0 + ex.down + 0.5, pt = tt => repProgress((((tt) % cyc) + cyc) % cyc, ex.up, 1.0, ex.down);
  F.fp_k.setProgress(pt(t - 16)); F.fp_n.setProgress(pt(t - 16.2));
  const mp = (t % 1.6) / 1.6;
  F.fm_k.setProgress(Math.max(0, Math.sin(Math.PI * 2 * mp))); F.fm_n.setProgress(Math.max(0, Math.sin(Math.PI * 2 * mp + 1.2)));
  F.fm_c.setProgress(0.5 - 0.5 * Math.cos(2 * Math.PI * t / 0.9));
  const b2 = $("#ball2"); b2.setAttribute("cx", 330 + 380 * (0.5 - 0.5 * Math.cos(Math.PI * 2 * mp))); b2.setAttribute("cy", 1010 - 140 * Math.abs(Math.sin(Math.PI * 2 * mp)));
  Object.values(F).forEach(f => f.hl.style.opacity = 0);

  PILLS.forEach(p => { const q = outBack(prog(t, p.t, 0.4), 1.4); p.el.style.opacity = clamp(q * 1.3); p.el.style.transform = `translateY(${(1 - q) * 40 + Math.sin(t * 2 + p.k) * 6}px) scale(${0.85 + 0.15 * clamp(q)})`; });

  const head = $("#head"), ch = CH.find(c => t >= c.s - 0.12 && t < c.end);
  if (ch && t < OUT_AT) {
    if (head._ch !== ch) { head.innerHTML = ch.words.map(w => `<span class="${KW.includes(w.w.toLowerCase().replace(/[^a-z0-9.!]/g, "")) ? "grad" : ""}">${w.w}</span>`).join(""); head._ch = ch;
      head.style.fontSize = ""; if (ch.words.some(w => w.w.length > 12)) head.style.fontSize = "70px"; }
    [...head.children].forEach((sp, i) => { const p = outCubic(prog(t, ch.words[i].s - 0.06, 0.3)); sp.style.opacity = 0.28 + 0.72 * p; sp.style.filter = `blur(${(1 - p) * 9}px)`; sp.style.transform = `translateY(${(1 - p) * 14}px)`; });
    head.style.opacity = 1 - prog(t, OUT_AT - 0.3, 0.3);
  } else { head.innerHTML = ""; head._ch = null; }

  const W = $("#word"), wc = WC.find(c => t >= c.t - 0.08 && t < c.t + c.d + 0.35);
  if (wc) {
    const pin = outQuint(prog(t, wc.t - 0.08, 0.38)), pout = ease(prog(t, wc.t + wc.d, 0.35));
    W.style.opacity = pin * (1 - pout);
    const w = W.querySelector(".w"); w.textContent = wc.text;
    w.style.transform = `scale(${1.08 - 0.08 * pin + 0.03 * prog(t, wc.t, wc.d)})`; w.style.filter = `blur(${(1 - pin) * 16 + pout * 10}px)`;
  } else W.style.opacity = 0;

  const wp = ease(prog(t, OUT_AT, 0.4));
  $("#white").style.clipPath = `inset(${(1 - wp) * 100}% 0 0 0)`;
  ["#l1", "#l2", "#l3"].forEach((id, i) => { const q = outQuint(prog(t, OUT_AT + 0.25 + i * 0.14, 0.6)); $(id).style.transform = `translateY(${(1 - q) * 120}%)`; $(id).parentElement.style.visibility = t >= OUT_AT ? "visible" : "hidden"; });
  const m = outCubic(prog(t, OUT_AT + 0.9, 0.55)); $("#mark").style.opacity = m; $("#mark").style.transform = `translateY(${(1 - m) * 24}px)`;
  $("#disc").style.opacity = outCubic(prog(t, OUT_AT + 1.2, 0.5));
};

(async () => {
  INFO = await (await fetch("words.json")).json();
  EK = await (await fetch("env_k.json")).json();
  EN = await (await fetch("env_n.json")).json();
  buildChunks();
  OUT_AT = sentS("cta").e + 0.25;
  DURATION = Math.ceil((OUT_AT + 3.6) * 10) / 10; window.DURATION = DURATION;
  const at = (id, pre = 0.25) => sentS(id).s - pre;
  SC = [
    { el: $("#talk"), t: 0 }, { el: $("#teras"), t: at("teras") }, { el: $("#ph_home"), t: at("pasang") },
    { el: $("#pagi"), t: at("pagi") }, { el: $("#ph_play"), t: at("fitur") }, { el: $("#main"), t: at("main1") }, { el: $("#talk"), t: at("coba") },
  ];
  const sepuluh = findWord("sepuluh", sentS("pagi").s), ikut = findWord("ikut", sentS("main").s);
  if (sepuluh) WC.push({ t: sepuluh.s, d: 1.0, text: "10 menit." });
  if (ikut) WC.push({ t: ikut.s, d: 0.95, text: "Ikut main." });
  [["gambar", "#p1"], ["suara", "#p2"], ["hitungan", "#p3"]].forEach(([w, id], k) => { const x = findWord(w, sentS("fitur").s); if (x) PILLS.push({ el: $(id), t: x.s - 0.05, k }); });
  F.ft_k = mk("ft_k", SIT, KAKEK, false, "40 -20 160 192");
  F.ft_n = mk("ft_n", SIT, NENEK, false, "40 -20 160 192");
  F.ft_c = mk("ft_c", KICK, CUCU, true, "20 -10 170 182");
  F.fp_k = mk("fp_k", EX["luruskan-lutut"], KAKEK, false, "20 -10 180 182");
  F.fp_n = mk("fp_n", EX["luruskan-lutut"], NENEK, false, "20 -10 180 182");
  F.fm_k = mk("fm_k", KICK, KAKEK, false, "20 -10 170 182");
  F.fm_n = mk("fm_n", KICK, NENEK, false, "20 -10 170 182");
  F.fm_c = mk("fm_c", RUN, CUCU, true, "20 -10 170 182");
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  window.render(0); window.__ready = true;
})();
</script>
