<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Lutut Kuat – Kakek</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=block" rel="stylesheet">
<style>
:root { --bg:#F5F5F7; --ink:#1D1D1F; --mute:#86868B; --g1:#0f766e; --g2:#12a594; --g3:#f59e0b; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: Inter, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.grad { background: linear-gradient(95deg, var(--g1), var(--g2) 50%, var(--g3)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .04em; }

#head { position: absolute; left: 80px; width: 920px; top: 250px; height: 320px; display: flex; flex-wrap: wrap; align-items: flex-end; align-content: flex-end;
  font-weight: 800; font-size: 84px; line-height: 1.04; letter-spacing: -.035em; color: var(--ink); }
#head span { display: inline-block; margin-right: .22em; }

#shadow, #card { position: absolute; left: 60px; top: 620px; width: 960px; height: 1180px; border-radius: 56px; }
#shadow { box-shadow: 0 50px 90px -20px rgba(0,0,0,.28), 0 18px 36px -12px rgba(0,0,0,.18); }
#card { overflow: hidden; background: #ddd; }
.sc { position: absolute; inset: 0; opacity: 0; }
.sc .fig { position: absolute; }
.sc .fig svg { width: 100%; height: auto; display: block; overflow: visible; }

.fig-body, .fig-far { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 8; }
.fig-arm { stroke-width: 7; }
.fig-prop { fill: none; stroke: #8a7358; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.fig-floor, .fig-mat { display: none; }
.fig-hl { opacity: 0; }

.phone { position: absolute; left: 50%; top: 70px; width: 500px; height: 1040px; margin-left: -250px; border-radius: 70px; background: #111; padding: 20px;
  box-shadow: 0 40px 90px rgba(8,40,37,.35); }
.phone .scr { position: relative; width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #f6f4ee; }
.phone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.phone .notch { position: absolute; top: 20px; left: 50%; width: 150px; height: 40px; margin-left: -75px; background: #111; border-radius: 0 0 24px 24px; z-index: 2; }
.pill { position: absolute; opacity: 0; padding: 22px 38px; border-radius: 999px; background: rgba(255,255,255,.78);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 0 0 1.5px rgba(255,255,255,.7) inset, 0 14px 34px rgba(0,0,0,.16);
  font-weight: 800; font-size: 50px; letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }

#word { position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; opacity: 0; }
#word .w { font-weight: 900; letter-spacing: -.055em; line-height: .95; text-align: center; font-size: 230px; white-space: nowrap; }

#white { position: absolute; inset: 0; background: var(--bg); clip-path: inset(100% 0 0 0); }
.oln { position: absolute; left: 90px; overflow: hidden; height: 200px; }
.oln span { display: block; font-weight: 800; font-size: 180px; line-height: 1; letter-spacing: -.055em; color: var(--ink); white-space: nowrap; }
#mark { position: absolute; left: 90px; top: 1180px; opacity: 0; display: flex; align-items: center; gap: 28px; }
#mark img { width: 120px; height: 120px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
#mark b { display: block; font-weight: 800; font-size: 80px; letter-spacing: -.045em; color: var(--ink); }
#mark small { display: block; font-weight: 600; font-size: 34px; color: #6e6e73; margin-top: 6px; letter-spacing: -.01em; }
#disc { position: absolute; left: 90px; right: 90px; top: 1560px; font-weight: 500; font-size: 28px; color: var(--mute); opacity: 0; }
</style>
</head>

<script>
const { Figure, repProgress } = LK_FIG;
const EX = Object.fromEntries(LK_DATA.EXERCISES.map(e => [e.id, e]));
const NS = "http://www.w3.org/2000/svg";
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, d) => clamp((t - a) / d);
const ease = t => t * t * (3 - 2 * t);
const outCubic = t => 1 - Math.pow(1 - t, 3);
const outQuint = t => 1 - Math.pow(1 - t, 5);
const outBack = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const FPS = 30;
let INFO, ENV, CH = [], SC = [], WC = [], PILLS = [], OUT_AT, DURATION;

// ---------- tokoh figur (kakek ber-peci & cucu) ----------
function dress(fig, c) {
  const root = fig.svg.firstChild;
  fig.torso.style.stroke = c.top; fig.arm.style.stroke = c.top;
  fig.nearLeg.style.stroke = c.legs; fig.farLeg.style.stroke = c.legsFar;
  fig.head.style.fill = c.skin;
  const hat = document.createElementNS(NS, "path"); hat.setAttribute("fill", c.hat);
  root.insertBefore(hat, fig.nearLeg);
  const orig = fig.render.bind(fig);
  fig.render = pose => {
    orig(pose);
    const hx = +fig.head.getAttribute("cx"), hy = +fig.head.getAttribute("cy");
    hat.setAttribute("d", c.peci
      ? `M${hx - 10.5} ${hy - 3} L${hx - 9.5} ${hy - 12} Q${hx} ${hy - 15} ${hx + 9.5} ${hy - 12} L${hx + 10.5} ${hy - 3}Z`
      : `M${hx - 10.5} ${hy - 1} Q${hx - 11} ${hy - 13} ${hx} ${hy - 12.5} Q${hx + 11} ${hy - 13} ${hx + 10.5} ${hy - 1} Q${hx} ${hy - 7} ${hx - 10.5} ${hy - 1}Z`);
  };
}
const KAKEK = { top: "#8b5a2b", legs: "#3f3f46", legsFar: "#71717a", skin: "#dca77b", hat: "#1d1d1f", peci: true };
const CUCU = { top: "#f2a541", legs: "#4a6fa5", legsFar: "#86a0c8", skin: "#f0c49b", hat: "#3a2a20", peci: false };
function mk(id, ex, c, mirror, vb) {
  const f = new Figure(document.getElementById(id)); f.setExercise(ex, mirror);
  if (vb) f.svg.setAttribute("viewBox", vb);
  dress(f, c); return f;
}
const SEAT = { hip: [95, 121], torso: 6, n: [90, 0, 90], f: [90, 0, 90], arm: [25, 60] };
const STAND = { hip: [95, 86], torso: 3, n: [0, 0, 90], f: [0, 0, 90], arm: [5, 10] };
const RUN = { frames: [{ ...STAND, torso: 10, n: [35, -10, 80], f: [-30, -55, 120], arm: [-30, -60] },
                       { ...STAND, torso: 10, n: [-30, -55, 120], f: [35, -10, 80], arm: [30, 70] }], props: [], highlight: "knee" };
const KICK = { frames: [{ ...STAND, torso: 4, n: [-20, -30, 110], f: [0, 0, 90], arm: [10, 20] },
                        { ...STAND, torso: -4, n: [40, 30, 70], f: [0, 0, 90], arm: [-20, -10] }], props: [], highlight: "knee" };
const SIT = { frames: [{ ...SEAT, torso: 14 }], props: ["chair"], highlight: "knee" };

let ft_k, ft_c, fp_k, fm_k, fm_c;

// ---------- data & timeline ----------
function findWord(sub, after = 0) { return INFO.words.find(w => w.s >= after && w.w.toLowerCase().includes(sub)); }
function sentS(id) { return INFO.sentences.find(s => s.id === id); }

function buildChunks() {
  let ws = INFO.words.map(w => ({ ...w }));
  // gabung "lututkuat titik web titik id" jadi satu kata
  const k = ws.findIndex(w => /lututkuat/i.test(w.w));
  if (k >= 0) { const last = ws.findIndex((w, i) => i > k && /^id\W*$/i.test(w.w)); if (last > k) ws.splice(k, last - k + 1, { w: "lututkuat.web.id", s: ws[k].s, e: ws[last].e, i: ws[k].i }); }
  let cur = [];
  const push = () => { if (cur.length) CH.push({ words: cur, s: cur[0].s, e: cur[cur.length - 1].e }); cur = []; };
  ws.forEach((w, idx) => {
    if (cur.length && (cur[0].i !== w.i || cur.length >= 4)) push();
    cur.push(w);
    const nx = ws[idx + 1];
    if (nx && nx.s - w.e > 0.28) push();
  });
  push();
  CH.forEach((c, i) => c.end = CH[i + 1] ? Math.min(CH[i + 1].s, c.e + 1.2) : c.e + 0.8);
  CH[0].s = 0;
}
const KW = ["raka", "lutut", "kuat", "sepuluh", "menit", "gambarnya", "suara", "hitungannya", "main", "gratis", "lututkuat.web.id", "pagi"];

window.render = t => {
  const fr = Math.min(ENV.length - 1, Math.round(t * FPS));
  const env = ENV[fr] || 0, envS = (ENV[Math.max(0, fr - 2)] + env + (ENV[fr + 2] || 0)) / 3;

  // scene di dalam kartu
  const ops = new Map();
  SC.forEach((s, i) => {
    const nx = SC[i + 1];
    const a = i === 0 ? 1 : ease(prog(t, s.t, 0.45));
    const b = nx ? ease(prog(t, nx.t, 0.45)) : 0;
    const op = t < s.t ? 0 : a * (1 - b);
    const prev = ops.get(s.el);
    if (!prev || op > prev.op) ops.set(s.el, { op, sc: 1.03 - 0.03 * a + 0.025 * prog(t, s.t, 6) });
  });
  ops.forEach((v, el) => { el.style.opacity = v.op; el.style.transform = `scale(${v.sc})`; });
  // kartu sedikit bernapas
  const cardIn = 1;
  // ---- kakek bicara ----
  const hg = $("#headg"), tilt = Math.sin(t * 1.1) * 1.6 + envS * 2.2, nod = Math.sin(t * 2.3) * envS * 4;
  hg.setAttribute("transform", `rotate(${tilt} 480 700) translate(0 ${nod})`);
  $("#body").setAttribute("transform", `translate(0 ${Math.sin(t * 1.6) * 3})`);
  $("#mouth").setAttribute("ry", (3 + 30 * env).toFixed(1));
  $("#mouth").setAttribute("rx", (34 + 10 * env).toFixed(1));
  $("#mouth").style.opacity = env > 0.06 ? 1 : 0;
  $("#smile").style.opacity = env > 0.06 ? 0 : 1;
  const bl = (t % 3.4) > 3.25 || (t % 5.1) > 4.98 ? 0.12 : 1;
  ["#eyeL", "#eyeR"].forEach(e => $(e).setAttribute("ry", (13 * bl).toFixed(1)));
  $("#brows").setAttribute("transform", `translate(0 ${-envS * 9})`);

  // ---- figur ----
  const sit = { ...SEAT, torso: 14 + 3 * Math.sin(t * 0.9) };
  ft_k.render(sit);
  ft_c.setProgress(0.5 - 0.5 * Math.cos(2 * Math.PI * t / 1.3));
  const b1 = $("#ball1"), kp = (t % 1.3) / 1.3;
  b1.setAttribute("cx", 760 - 40 * Math.sin(Math.PI * kp)); b1.setAttribute("cy", 1010 - 120 * Math.sin(Math.PI * kp));
  const ex = EX["luruskan-lutut"], cyc = ex.up + 1.0 + ex.down + 0.5;
  fp_k.setProgress(repProgress((((t - 15) % cyc) + cyc) % cyc, ex.up, 1.0, ex.down));
  const mp = (t % 1.6) / 1.6;
  fm_k.setProgress(Math.max(0, Math.sin(Math.PI * 2 * mp)));
  fm_c.setProgress(0.5 - 0.5 * Math.cos(2 * Math.PI * t / 0.9));
  const b2 = $("#ball2"), bx = 300 + 360 * (0.5 - 0.5 * Math.cos(Math.PI * 2 * mp));
  b2.setAttribute("cx", bx); b2.setAttribute("cy", 1010 - 140 * Math.abs(Math.sin(Math.PI * 2 * mp)));
  [ft_k, ft_c, fp_k, fm_k, fm_c].forEach(f => f.hl.style.opacity = 0);

  // ---- pill fitur ----
  PILLS.forEach(p => { const q = outBack(prog(t, p.t, 0.4), 1.4); p.el.style.opacity = clamp(q * 1.3); p.el.style.transform = `translateY(${(1 - q) * 40 + Math.sin(t * 2 + p.k) * 6}px) scale(${0.85 + 0.15 * clamp(q)})`; });

  // ---- headline per kata ----
  const head = $("#head"), ch = CH.find(c => t >= c.s - 0.12 && t < c.end);
  if (ch && t < OUT_AT) {
    if (head._ch !== ch) { head.innerHTML = ch.words.map(w => `<span class="${KW.includes(w.w.toLowerCase().replace(/[^a-z0-9.]/g, "")) ? "grad" : ""}">${w.w}</span>`).join(""); head._ch = ch;
      head.style.fontSize = ""; if (head.scrollWidth > 940 || ch.words.some(w => w.w.length > 12)) head.style.fontSize = "70px"; }
    [...head.children].forEach((sp, i) => { const p = outCubic(prog(t, ch.words[i].s - 0.06, 0.3)); sp.style.opacity = 0.28 + 0.72 * p; sp.style.filter = `blur(${(1 - p) * 9}px)`; sp.style.transform = `translateY(${(1 - p) * 14}px)`; });
    head.style.opacity = 1 - prog(t, OUT_AT - 0.3, 0.3);
  } else { head.innerHTML = ""; head._ch = null; }

  // ---- kartu satu kata ----
  const W = $("#word"), wc = WC.find(c => t >= c.t - 0.08 && t < c.t + c.d + 0.35);
  if (wc) {
    const pin = outQuint(prog(t, wc.t - 0.08, 0.38)), pout = ease(prog(t, wc.t + wc.d, 0.35));
    W.style.opacity = pin * (1 - pout);
    const w = W.querySelector(".w"); w.textContent = wc.text;
    w.style.transform = `scale(${1.08 - 0.08 * pin + 0.03 * prog(t, wc.t, wc.d)})`; w.style.filter = `blur(${(1 - pin) * 16 + pout * 10}px)`;
  } else W.style.opacity = 0;

  // ---- outro ----
  const wp = ease(prog(t, OUT_AT, 0.4));
  $("#white").style.clipPath = `inset(${(1 - wp) * 100}% 0 0 0)`;
  ["#l1", "#l2", "#l3"].forEach((id, i) => { const q = outQuint(prog(t, OUT_AT + 0.25 + i * 0.14, 0.6)); $(id).style.transform = `translateY(${(1 - q) * 120}%)`; $(id).parentElement.style.visibility = t >= OUT_AT ? "visible" : "hidden"; });
  const m = outCubic(prog(t, OUT_AT + 0.9, 0.55)); $("#mark").style.opacity = m; $("#mark").style.transform = `translateY(${(1 - m) * 24}px)`;
  $("#disc").style.opacity = outCubic(prog(t, OUT_AT + 1.2, 0.5));
};

(async () => {
  INFO = await (await fetch("words.json")).json();
  ENV = await (await fetch("env.json")).json();

  SC = [
    { el: $("#talk"), t: 0 },

    { el: $("#pagi"), t: at("pagi") },
    { el: $("#ph_play"), t: at("fitur") },
    { el: $("#main"), t: at("main") },
    { el: $("#talk"), t: at("cta") },
  ];
  // elemen #talk dipakai dua kali: buat salinan referensi berbasis waktu
  SC[6] = { el: $("#talk"), t: at("cta") };
  const sepuluh = findWord("sepuluh", sentS("pagi").s), ikut = findWord("ikut", sentS("main").s);
  if (sepuluh) WC.push({ t: sepuluh.s, d: 1.0, text: "10 menit." });
  if (ikut) WC.push({ t: ikut.s, d: 0.95, text: "Ikut main." });
  [["gambar", "#p1"], ["suara", "#p2"], ["hitungan", "#p3"]].forEach(([w, id], k) => { const x = findWord(w, sentS("fitur").s); if (x) PILLS.push({ el: $(id), t: x.s - 0.05, k }); });

  ft_k = mk("ft_k", SIT, KAKEK, false, "40 -20 160 192");
  ft_c = mk("ft_c", KICK, CUCU, true, "20 -10 170 182");
  fp_k = mk("fp_k", EX["luruskan-lutut"], KAKEK, false, "20 -10 180 182");
  fm_k = mk("fm_k", KICK, KAKEK, false, "20 -10 170 182");
  fm_c = mk("fm_c", RUN, CUCU, true, "20 -10 170 182");
  [ft_k, fp_k].forEach(f => f.svg.querySelectorAll(".fig-prop").forEach(p => p.style.stroke = "#9a7a55"));
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  window.render(0);
  window.__ready = true;
})();
